# GitHub-hosted runners ONLY. Never serve this repository with a self-hosted
# runner: a workflow from a public fork pull request can execute arbitrary code
# on the owner's machine.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint Bash
        run: shellcheck bin/* hooks/* lib/*.sh scripts/*.sh test/*.bash
      - name: Fetch test dependency
        run: scripts/fetch-test-deps.sh
      - name: Check syntax
        run: |
          for script in bin/* hooks/* lib/*.sh scripts/*.sh test/*.bash; do
            bash -n "$script"
          done
      - name: Test
        run: test/vendor/bats-core/bin/bats test/
      - name: Check private terms (no-op without local terms)
        run: scripts/check-no-private-terms.sh
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: dashboard/.tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            dashboard/deps
            dashboard/_build
          key: dashboard-${{ runner.os }}-${{ hashFiles('dashboard/.tool-versions', 'dashboard/mix.lock') }}
      - name: Fetch dependencies
        run: mix deps.get --check-locked
      - name: Check formatting
        run: mix format --check-formatted
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Test
        run: mix test
      - name: Compile for the smoke test
        run: MIX_ENV=prod mix compile
      - name: Smoke test the running server
        working-directory: .
        run: |
          scripts/fetch-test-deps.sh
          test/vendor/bats-core/bin/bats test/dashboard-smoke.bats
